<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동아리 아니마</title>
<style>
:root{--bg:#f2f4ef;--ink:#1d2433;--mute:#667085;--line:#d9ddd3;--card:#fff;--acc:#4f46e5;--ok:#17805d;--okbg:#dff3ea}
@media (prefers-color-scheme:dark){:root{--bg:#141820;--ink:#e8ebf2;--mute:#97a0b3;--line:#2a3140;--card:#1b2130;--acc:#8b86ff;--ok:#5fd4a4;--okbg:#18372d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
header{padding:28px 20px 12px;max-width:980px;margin:auto}
h1{font-size:34px;margin:0;letter-spacing:-.03em;font-weight:800}
h1 small{display:block;font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:2px}
main{max-width:980px;margin:auto;padding:0 20px 60px}
nav{display:flex;gap:6px;margin:14px 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--mute)}
.stat b{display:block;font-size:20px;color:var(--ink)}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:160px}
.row{display:grid;grid-template-columns:24px 1fr 1fr 2.6fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.row.off{opacity:.5}
.name{font-weight:700}.tel{color:var(--mute);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.chip:focus-visible,nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.login{max-width:340px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.login input{width:100%;margin:10px 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;width:100%}
.doc{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:inherit}
.doc span{color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:13px;margin:10px 0}
.hide{display:none}
@media(max-width:640px){.row{grid-template-columns:24px 1fr}.row .tel,.row .chips{grid-column:2}.chips{justify-content:flex-start}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.tools .sp{flex:1}.chip.solid{background:var(--acc);color:#fff;border-color:var(--acc)}.chip.danger{color:#c0392b;border-color:#c0392b}
.chip:disabled{opacity:.4;cursor:not-allowed}input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.g{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;font:inherit;color:inherit;cursor:pointer}
.g b{display:block;font-size:17px}.g span{color:var(--mute);font-size:13px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ghead h2{margin:0;flex:1;font-size:22px}
.gm{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.st{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}.st.done{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(520px,92vw);max-height:80vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}.pick{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="login" class="login">
  <h1>아니마<small>운영진 로그인</small></h1>
  <input id="pw" type="password" placeholder="운영진 비밀번호" aria-label="운영진 비밀번호">
  <button class="btn" id="go">들어가기</button>
  <p class="note" id="loginNote"></p>
</div>

<div id="app" class="hide">
<header><h1>동아리 아니마<small id="mode"></small></h1></header>
<main>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="members">명단</button>
    <button role="tab" aria-selected="false" data-tab="groups">소모임</button>
    <button role="tab" aria-selected="false" data-tab="docs">문서</button>
  </nav>

  <section id="members">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input id="q" placeholder="이름·연락처 검색" aria-label="검색">
      <select id="filter" aria-label="필터">
        <option value="">전체</option><option value="wait">입금 대기</option><option value="inv">초대 대기</option><option value="off">비활성</option>
      </select>
    </div>
    <div class="tools">
      <label><input type="checkbox" id="all"> 전체 선택</label><b id="cnt">0명 선택</b><span class="sp"></span>
      <select id="bf" aria-label="변경할 항목"><option value="active">활성</option><option value="guide">안내문구 전달</option><option value="paid">입금완료</option><option value="invited">초대완료</option></select>
      <button class="chip solid" id="bon" disabled>켜기</button><button class="chip" id="boff" disabled>끄기</button>
      <button class="chip danger" id="bdel" disabled>삭제</button>
    </div>
    <div id="list"></div>
    <p class="note">안내문구 전달·초대완료는 카카오톡 봇이 자동으로 켭니다. 입금완료는 확인 후 직접 눌러주세요.</p>
  </section>

  <section id="groups" class="hide">
    <div id="gview">
      <div class="bar"><input id="gn" placeholder="새 소모임 이름"><button class="chip solid" id="gadd">소모임 만들기</button></div>
      <div class="gl" id="gl"></div>
    </div>
    <div id="gdetail" class="hide">
      <div class="ghead"><button class="chip" id="gback">← 소모임 목록</button><h2 id="gt"></h2><button class="chip solid" id="ginv">소모임 초대</button></div>
      <div id="gml"></div>
    </div>
  </section>

  <section id="docs" class="hide">
    <div class="bar">
      <select id="cat" aria-label="분류"><option value="">전체</option><option>회의록</option><option>포스터</option><option>메모</option></select>
    </div>
    <div id="docList"></div>
    <div class="bar" style="margin-top:16px">
      <select id="nc"><option>회의록</option><option>포스터</option><option>메모</option></select>
      <input id="nt" placeholder="제목">
      <input id="nl" placeholder="구글 드라이브 링크">
      <button class="chip" id="addDoc">문서 추가</button>
    </div>
  </section>
</main>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0" id="dt"></h3>
  <input id="dq" placeholder="이름 검색" style="width:100%;margin-bottom:8px">
  <div id="dl" style="overflow:auto;max-height:46vh"></div>
  <div class="bar" style="margin:12px 0 0;justify-content:flex-end"><button class="chip" id="dc">취소</button><button class="chip solid" id="dok" disabled>초대하기</button></div>
</dialog>
<script>
// ★ Apps Script 웹 앱 URL을 넣으세요. 비워두면 연습용(데모) 데이터로 동작합니다.
const API_URL = "";

let PW = "", members = [], docs = [], groups = [], gm = [], sel = new Set(), cur = null;
const $ = s => document.querySelector(s);
const DEMO = !API_URL;
const demoMembers = [
  {row:2,이름:"김하늘",연락처:"010-1111-2222",활성:true,안내전달:true,입금완료:true,초대완료:true},
  {row:3,이름:"이도윤",연락처:"010-3333-4444",활성:true,안내전달:true,입금완료:false,초대완료:false},
  {row:4,이름:"박서연",연락처:"010-5555-6666",활성:true,안내전달:false,입금완료:false,초대완료:false},
  {row:5,이름:"최민준",연락처:"010-7777-8888",활성:false,안내전달:true,입금완료:true,초대완료:true}
];
const demoDocs = [{분류:"회의록",제목:"10월 정기회의",링크:"#",날짜:"2026-10-02"},{분류:"포스터",제목:"신입 모집 포스터",링크:"#",날짜:"2026-09-20"}];
const demoG = {groups:[{row:2,소모임명:"보드게임"},{row:3,소모임명:"러닝"}],members:[{row:2,소모임명:"보드게임",이름:"김하늘",연락처:"010-1111-2222",초대상태:"완료"}]};
let nextRow = 100;

async function api(params, body){
  if (DEMO) return null;
  if (body) {
    const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify({pw:PW, ...body})});
    return r.json();
  }
  const r = await fetch(API_URL + "?" + new URLSearchParams({pw:PW, ...params}));
  return r.json();
}

async function load(){
  if (DEMO){ members = structuredClone(demoMembers); docs = structuredClone(demoDocs); groups = structuredClone(demoG.groups); gm = structuredClone(demoG.members); return true; }
  const m = await api({action:"members"});
  if (m.error) return false;
  members = m; docs = await api({action:"docs"});
  const g = await api({action:"groups"}); groups = g.groups; gm = g.members;
  sel = new Set([...sel].filter(r => members.some(x => x.row === r)));
  return true;
}

function render(){
  const q = $("#q").value.trim(), f = $("#filter").value;
  const list = members.filter(m => {
    if (q && !(m.이름+m.연락처).includes(q)) return false;
    if (f==="wait") return m.활성 && m.안내전달 && !m.입금완료;
    if (f==="inv") return m.입금완료 && !m.초대완료;
    if (f==="off") return !m.활성;
    return true;
  });
  const act = members.filter(m=>m.활성);
  $("#stats").innerHTML = [
    ["전체",members.length],["활동 중",act.length],
    ["입금 대기",act.filter(m=>!m.입금완료).length],["초대 대기",members.filter(m=>m.입금완료&&!m.초대완료).length]
  ].map(([a,b])=>`<div class="stat">${a}<b>${b}</b></div>`).join("");
  $("#list").innerHTML = list.length ? list.map(m=>`
    <div class="row ${m.활성?"":"off"}">
      <input type="checkbox" class="ck" data-row="${m.row}" ${sel.has(m.row)?"checked":""} aria-label="${esc(m.이름)} 선택">
      <div class="name">${esc(m.이름)}</div><div class="tel">${esc(m.연락처)}</div>
      <div class="chips">
        ${chip(m,"active","활성",m.활성)}${chip(m,"guide","안내문구 전달",m.안내전달)}
        ${chip(m,"paid","입금완료",m.입금완료)}${chip(m,"invited","초대완료",m.초대완료)}
      </div></div>`).join("") : `<p class="note">조건에 맞는 인원이 없습니다.</p>`;
  $("#cnt").textContent = sel.size + "명 선택";
  ["bon","boff","bdel"].forEach(i=>$("#"+i).disabled = !sel.size);
  $("#all").checked = list.length>0 && list.every(m=>sel.has(m.row));
  $("#all").dataset.rows = JSON.stringify(list.map(m=>m.row));
  const c = $("#cat").value;
  $("#docList").innerHTML = docs.filter(d=>!c||d.분류===c).map(d=>`
    <a class="doc" href="${esc(d.링크)}" target="_blank" rel="noopener"><div><b>${esc(d.제목)}</b><br><span>${esc(d.분류)}</span></div><span>${esc(String(d.날짜).slice(0,10))}</span></a>`).join("") || `<p class="note">등록된 문서가 없습니다. 아래에서 드라이브 링크를 추가하세요.</p>`;
  renderGroups();
}
function renderGroups(){
  $("#gl").innerHTML = groups.length ? groups.map(g=>{const n=gm.filter(x=>x.소모임명===g.소모임명).length;
    return `<button class="g" data-g="${esc(g.소모임명)}"><b>${esc(g.소모임명)}</b><span>${n}명</span></button>`}).join("") : `<p class="note">소모임이 없습니다. 위에서 만들어보세요.</p>`;
  $("#gview").classList.toggle("hide",!!cur); $("#gdetail").classList.toggle("hide",!cur);
  if(!cur) return;
  $("#gt").textContent = cur;
  const ms = gm.filter(x=>x.소모임명===cur);
  $("#gml").innerHTML = ms.length ? ms.map(x=>`<div class="gm"><div class="name">${esc(x.이름)}</div><div class="tel">${esc(x.연락처)}</div>
    <span class="st ${x.초대상태==="완료"?"done":""}">${x.초대상태==="완료"?"초대완료":"봇 초대 대기"}</span>
    <button class="chip" data-rm="${x.row}">제외</button></div>`).join("") : `<p class="note">아직 소속 인원이 없습니다. 오른쪽 위 '소모임 초대'로 추가하세요.</p>`;
}
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = {active:"활성",guide:"안내전달",paid:"입금완료",invited:"초대완료"};
const chip = (m,f,label,on)=>`<button class="chip" aria-pressed="${!!on}" data-row="${m.row}" data-f="${f}">${label}</button>`;

async function save(body, ok){ try{ await api(null, body); return true; }catch{ alert("저장에 실패했습니다. 다시 시도해주세요."); return false; } }
async function reload(){ if(!DEMO) await load(); render(); }

$("#list").addEventListener("click", async e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  const m = members.find(x=>x.row==b.dataset.row), k = KEY[b.dataset.f];
  m[k] = !m[k]; render();
  if(!await save({action:"set",row:m.row,field:b.dataset.f,value:m[k]})){ m[k]=!m[k]; render(); }
});
$("#list").addEventListener("change", e=>{
  if(!e.target.classList.contains("ck")) return;
  const r = Number(e.target.dataset.row); e.target.checked ? sel.add(r) : sel.delete(r); render();
});
$("#all").onchange = e=>{ JSON.parse(e.target.dataset.rows).forEach(r=> e.target.checked ? sel.add(r) : sel.delete(r)); render(); };
async function bulk(v){
  const f = $("#bf").value, rows=[...sel];
  members.filter(m=>sel.has(m.row)).forEach(m=>m[KEY[f]]=v); render();
  await save({action:"set_many",rows,field:f,value:v}); await reload();
}
$("#bon").onclick=()=>bulk(true); $("#boff").onclick=()=>bulk(false);
$("#bdel").onclick = async ()=>{
  if(!confirm(sel.size+"명을 명단에서 삭제할까요? 시트에서도 지워지며 되돌릴 수 없습니다.")) return;
  const rows=[...sel]; members = members.filter(m=>!sel.has(m.row)); sel.clear(); render();
  await save({action:"delete_members",rows}); await reload();
};

// ---- 소모임
$("#gadd").onclick = async ()=>{
  const n=$("#gn").value.trim(); if(!n||groups.some(g=>g.소모임명===n)) return alert("비어 있거나 이미 있는 이름입니다.");
  groups.push({row:nextRow++,소모임명:n}); $("#gn").value=""; render();
  await save({action:"add_group",name:n});
};
$("#gl").onclick = e=>{ const g=e.target.closest(".g"); if(g){cur=g.dataset.g; renderGroups();} };
$("#gback").onclick = ()=>{cur=null; renderGroups();};
$("#gml").onclick = async e=>{
  const b=e.target.closest("[data-rm]"); if(!b||!confirm("이 소모임 명단에서 제외할까요? (카카오톡 방 강퇴는 하지 않습니다)")) return;
  gm = gm.filter(x=>x.row!=b.dataset.rm); renderGroups();
  await save({action:"remove_group_member",row:Number(b.dataset.rm)}); await reload();
};
let pick = new Set();
function drawPick(){
  const q=$("#dq").value.trim(), in_=new Set(gm.filter(x=>x.소모임명===cur).map(x=>String(x.연락처)));
  const c = members.filter(m=>m.활성 && !in_.has(String(m.연락처)) && (!q||m.이름.includes(q)));
  $("#dl").innerHTML = c.map(m=>`<label class="pick"><input type="checkbox" data-r="${m.row}" ${pick.has(m.row)?"checked":""}><b>${esc(m.이름)}</b><span class="tel">${esc(m.연락처)}</span></label>`).join("") || `<p class="note">초대할 수 있는 인원이 없습니다.</p>`;
  $("#dok").disabled = !pick.size; $("#dok").textContent = pick.size ? pick.size+"명 초대하기" : "초대하기";
}
$("#ginv").onclick = ()=>{ pick.clear(); $("#dq").value=""; $("#dt").textContent = cur+" 초대할 인원 선택"; drawPick(); $("#dlg").showModal(); };
$("#dl").onchange = e=>{ const r=Number(e.target.dataset.r); e.target.checked?pick.add(r):pick.delete(r); drawPick(); };
$("#dq").oninput = drawPick; $("#dc").onclick = ()=>$("#dlg").close();
$("#dok").onclick = async ()=>{
  const ms = members.filter(m=>pick.has(m.row)).map(m=>({이름:m.이름,연락처:m.연락처}));
  ms.forEach(m=>gm.push({row:nextRow++,소모임명:cur,...m,초대상태:"대기"}));
  $("#dlg").close(); renderGroups();
  await save({action:"invite_group",group:cur,members:ms}); await reload();
};
$("#addDoc").onclick = async ()=>{
  const d={분류:$("#nc").value,제목:$("#nt").value.trim(),링크:$("#nl").value.trim(),날짜:new Date().toISOString()};
  if(!d.제목||!d.링크) return alert("제목과 링크를 입력하세요.");
  docs.unshift(d); render(); $("#nt").value=$("#nl").value="";
  await api(null,{action:"add_doc",category:d.분류,title:d.제목,link:d.링크});
};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  $("#members").classList.toggle("hide",b.dataset.tab!=="members");
  $("#docs").classList.toggle("hide",b.dataset.tab!=="docs");
  $("#groups").classList.toggle("hide",b.dataset.tab!=="groups");
});
["#q","#filter","#cat"].forEach(s=>$(s).addEventListener("input",render));

async function enter(){
  PW = $("#pw").value;
  $("#loginNote").textContent = "확인 중…";
  try{
    if(await load()){
      $("#login").classList.add("hide"); $("#app").classList.remove("hide");
      $("#mode").textContent = DEMO ? "데모 모드 · API_URL을 설정하면 구글 시트와 연결됩니다" : "구글 시트와 연결됨";
      render();
    } else $("#loginNote").textContent = "비밀번호가 맞지 않습니다.";
  }catch{ $("#loginNote").textContent = "서버에 연결하지 못했습니다. API_URL을 확인하세요."; }
}
$("#go").onclick = enter;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
if(DEMO) $("#loginNote").textContent = "데모 모드: 아무 비밀번호나 입력하세요.";
</script>
